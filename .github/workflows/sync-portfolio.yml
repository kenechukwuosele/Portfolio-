name: Weekly GitHub & Profile Sync

on:
  schedule:
    # Runs every Sunday at midnight UTC (00:00)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync:
    name: Sync GitHub Repositories & Stats
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔄 Execute Sync Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-profile.js

      - name: 🚀 Commit & Push Updates if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status --porcelain src/data/portfolioData.ts) ]]; then
            echo "✨ Changes detected in portfolioData.ts. Committing and pushing..."
            git add src/data/portfolioData.ts
            git commit -m "chore(cron): auto-sync latest GitHub repositories and statistics"
            git push origin main
            echo "🎉 Successfully synchronized and pushed latest portfolio updates!"
          else
            echo "✅ No new changes detected. Portfolio is up-to-date."
          fi
