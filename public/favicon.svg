<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Inner Ambient Glow Ring -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="url(#codeGrad)" stroke-opacity="0.2" stroke-width="1" />

  <!-- Code < / > Icon Glyph -->
  <g filter="url(#glow)" stroke="url(#codeGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Bracket < -->
    <path d="M22 23L13 32L22 41" />
    
    <!-- Slash / -->
    <path d="M36 20L28 44" stroke="#38bdf8" />
    
    <!-- Right Bracket > -->
    <path d="M42 23L51 32L42 41" />
  </g>
</svg>
